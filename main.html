<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music</title>
  <style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --accent:#a78bfa;--accent2:#c4b5fd;
    --text1:#fff;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.3);
    --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);
    --glass-border:rgba(255,255,255,.1);
    --danger:#f87171;--r:14px;--rsm:10px;
  }
  body{background:#07050f;color:var(--text1);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

  /* ── CANVAS ── */
  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

  /* ── SCREENS ── */
  .screen{display:none;position:relative;z-index:1}
  .screen.active{display:flex;flex-direction:column;min-height:100vh}

  /* ══ LIBRARY ══ */
  .lib-top{padding:56px 22px 0;display:flex;align-items:center;justify-content:space-between}
  .lib-top-left h1{
    font-size:30px;font-weight:700;letter-spacing:-.5px;
    background:linear-gradient(120deg,#fff 30%,var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 0 20px rgba(167,139,250,.4));
  }
  .lib-top-left p{font-size:12px;color:var(--text3);margin-top:3px}
  


  .search-row{padding:16px 22px 0}
  .search-wrap{
    display:flex;align-items:center;gap:10px;
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:var(--r);padding:11px 16px;backdrop-filter:blur(20px);
    transition:border-color .2s;
  }
  .search-wrap:focus-within{border-color:rgba(167,139,250,.4)}
  .search-wrap svg{flex-shrink:0;color:var(--text3)}
  .search-wrap input{background:transparent;border:none;outline:none;color:var(--text1);font-size:14px;width:100%}
  .search-wrap input::placeholder{color:var(--text3)}

  .tab-row{display:flex;gap:8px;padding:14px 22px 0;overflow-x:auto;scrollbar-width:none}
  .tab-row::-webkit-scrollbar{display:none}
  .tab{
    padding:7px 18px;border-radius:20px;font-size:13px;font-weight:500;
    cursor:pointer;border:1px solid var(--glass-border);color:var(--text2);
    background:var(--glass);white-space:nowrap;transition:all .2s;backdrop-filter:blur(10px);flex-shrink:0;
  }
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 18px rgba(167,139,250,.4)}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);padding:18px 22px 8px}

  .song-list{flex:1;overflow-y:auto;padding-bottom:120px}
  .song-list::-webkit-scrollbar{width:2px}
  .song-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

  .song-item{
    display:flex;align-items:center;gap:14px;padding:9px 22px;cursor:pointer;
    transition:background .15s;position:relative;
  }
  .song-item::after{content:'';position:absolute;bottom:0;left:76px;right:0;height:1px;background:rgba(255,255,255,.04)}
  .song-item:hover{background:rgba(255,255,255,.05)}
  .song-item.playing{background:rgba(167,139,250,.1)}

  .cover-thumb{
    width:52px;height:52px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;overflow:hidden;position:relative;
    border:1px solid rgba(255,255,255,.08);
    transition:transform .2s;
  }
  .song-item:hover .cover-thumb{transform:scale(1.05)}
  .cover-thumb .eq-anim{
    position:absolute;inset:0;background:rgba(0,0,0,.6);
    display:flex;align-items:flex-end;justify-content:center;
    gap:3px;padding-bottom:8px;border-radius:12px;opacity:0;transition:opacity .2s;
  }
  .song-item.playing .eq-anim{opacity:1}
  .eq-bar{width:4px;background:var(--accent2);border-radius:2px;animation:eqB .6s ease-in-out infinite alternate}
  .eq-bar:nth-child(2){animation-delay:.1s;animation-duration:.5s}
  .eq-bar:nth-child(3){animation-delay:.2s;animation-duration:.7s}
  .eq-bar:nth-child(4){animation-delay:.05s;animation-duration:.45s}
  @keyframes eqB{from{height:4px}to{height:18px}}

  .song-info{flex:1;min-width:0}
  .song-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song-item.playing .song-title{color:var(--accent2)}
  .song-meta{font-size:12px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song-right{display:flex;align-items:center;gap:2px;flex-shrink:0}
  .song-dur{font-size:12px;color:var(--text3);margin-right:4px}
  .icon-btn{
    width:32px;height:32px;border-radius:50%;background:transparent;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;
  }
  .icon-btn:hover{background:var(--glass2);color:var(--text1)}
  .icon-btn.fav-active{color:#f472b6}
  .icon-btn.del:hover{color:var(--danger)}

  /* ── MINI PLAYER ── */
  .mini-player{
    position:fixed;bottom:12px;left:12px;right:12px;
    background:rgba(15,10,30,.9);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
    border:1px solid var(--glass-border);border-radius:20px;
    padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px;
    cursor:pointer;z-index:99;
    box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04),0 0 30px rgba(167,139,250,.08);
    transition:opacity .3s,transform .3s;
  }
  .mini-player.hidden{opacity:0;pointer-events:none;transform:translateY(24px)}
  .mini-progress-bar{position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 20px 20px;overflow:hidden}
  .mini-progress-track{height:100%;background:rgba(255,255,255,.08)}
  .mini-progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .9s linear;width:0%;
    box-shadow:0 0 8px var(--accent);
  }
  .mini-cover{
    width:44px;height:44px;border-radius:10px;flex-shrink:0;
    font-size:20px;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.1);overflow:hidden;
  }
  .mini-info{flex:1;min-width:0}
  .mini-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-artist{font-size:11px;color:var(--text2);margin-top:1px}
  .mini-ctrls{display:flex;align-items:center}
  .mini-btn{
    width:38px;height:38px;border-radius:50%;background:transparent;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--text1);transition:background .15s;
  }
  .mini-btn:hover{background:var(--glass2)}
  .mini-play-btn{
    width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
    box-shadow:0 2px 12px rgba(167,139,250,.5);
  }



  /* ══ PLAYER SCREEN ══ */
  .player-screen{overflow:hidden;background:transparent}
  .player-bg-wrap{position:fixed;inset:0;z-index:0;overflow:hidden}
  .player-bg-blob{
    position:absolute;border-radius:50%;filter:blur(90px);opacity:0;
    transition:opacity 1.4s,background 1.4s;will-change:transform;
  }
  .player-bg-blob.b1{width:75vw;height:75vw;top:-20%;left:-25%;animation:bF1 9s ease-in-out infinite}
  .player-bg-blob.b2{width:65vw;height:65vw;bottom:-15%;right:-20%;animation:bF2 11s ease-in-out infinite}
  .player-bg-blob.b3{width:45vw;height:45vw;top:35%;left:25%;animation:bF3 13s ease-in-out infinite}
  @keyframes bF1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,9%) scale(1.1)}}
  @keyframes bF2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7%,-6%) scale(1.07)}}
  @keyframes bF3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5%,-8%) scale(.93)}}
  .player-bg-overlay{position:absolute;inset:0;background:rgba(4,3,14,.58)}
  .player-bg-noise{
    position:absolute;inset:0;opacity:.35;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .player-content{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

  /* ── PLAYER HEADER ── */
  .player-header{display:flex;align-items:center;gap:10px;padding:54px 20px 14px}
  .back-btn,.more-btn{
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;
    transition:background .15s;flex-shrink:0;
  }
  .back-btn:hover,.more-btn:hover{background:rgba(255,255,255,.18)}
  .ph-center{flex:1;text-align:center}
  .ph-center span{font-size:11px;text-transform:uppercase;letter-spacing:2.5px;color:rgba(255,255,255,.35)}
  .ph-center h3{font-size:14px;font-weight:500;margin-top:3px;color:rgba(255,255,255,.8)}

  /* ── VINYL / ARTWORK ── */
  .artwork-area{display:flex;justify-content:center;padding:10px 40px 0;position:relative}

  /* vinyl record behind artwork */
  .vinyl-wrap{position:relative;display:flex;align-items:center;justify-content:center}
  .vinyl-disc{
    position:absolute;
    width:calc(min(300px,74vw) + 40px);
    height:calc(min(300px,74vw) + 40px);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 30%, #222 31%, #111 40%, #1e1e1e 41%, #0d0d0d 60%, #191919 61%, #0a0a0a 80%, #1a1a1a 100%);
    box-shadow:0 10px 60px rgba(0,0,0,.8);
    opacity:0;transition:opacity .6s;
    animation:vinylSpin 6s linear infinite paused;
  }
  .vinyl-disc.visible{opacity:1}
  .vinyl-disc.spinning{animation-play-state:running}
  @keyframes vinylSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .vinyl-disc::after{
    content:'';position:absolute;
    width:28%;height:28%;border-radius:50%;
    top:50%;left:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,#3a3a3a 0%,#1a1a1a 60%,#111 100%);
    box-shadow:0 0 0 2px #333;
  }

  .artwork-shadow-ring{
    border-radius:28px;padding:3px;
    background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.03));
    position:relative;z-index:1;
    box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(167,139,250,.1);
    transition:box-shadow 1s;
  }
  .artwork-shadow-ring.glow{
    box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 60px rgba(167,139,250,.25);
  }
  .artwork{
    width:min(300px,74vw);height:min(300px,74vw);border-radius:26px;overflow:hidden;
    font-size:90px;display:flex;align-items:center;justify-content:center;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);position:relative;
  }
  .artwork.big{transform:scale(1.04)}
  .artwork::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 55%);
    pointer-events:none;border-radius:26px;
  }

  /* ── WAVEFORM CANVAS ── */
  #waveform-canvas{
  display:block;width:calc(30% - 56px);height:48px;margin:6px auto 0;
  opacity:.6;transition:opacity .3s;
}

  /* ── TRACK INFO ── */
  .track-info{padding:16px 28px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .track-text{flex:1;min-width:0}
  .track-title{
    font-size:22px;font-weight:700;letter-spacing:-.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 16px rgba(0,0,0,.4);
  }
  .track-artist{font-size:14px;color:rgba(255,255,255,.6);margin-top:5px}
  .fav-btn{
    width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.5);flex-shrink:0;margin-top:2px;
    transition:all .25s;backdrop-filter:blur(8px);
  }
  .fav-btn.active{color:#f472b6;background:rgba(244,114,182,.15);border-color:rgba(244,114,182,.35)}
  .fav-btn.active svg{filter:drop-shadow(0 0 6px #f472b6)}

  /* ── PROGRESS ── */
  .progress-area{padding:20px 28px 0}
  .seek-wrap{position:relative;height:20px;display:flex;align-items:center}
  .seek-bar{
    width:100%;-webkit-appearance:none;appearance:none;
    height:4px;border-radius:4px;outline:none;cursor:pointer;
    background:rgba(255,255,255,.12);
    background-image:linear-gradient(var(--accent),var(--accent));
    background-repeat:no-repeat;background-size:0% 100%;position:relative;z-index:1;
  }
  .seek-bar::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 3px rgba(167,139,250,.45),0 2px 8px rgba(0,0,0,.3);
    cursor:pointer;transition:transform .15s;
  }
  .seek-bar:active::-webkit-slider-thumb{transform:scale(1.5)}
  .time-row{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.35);margin-top:8px}

  /* ── CONTROLS ── */
  .controls-row{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between}
  .ctrl-sm{
    width:46px;height:46px;border-radius:50%;background:transparent;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.45);transition:all .15s;
  }
  .ctrl-sm:hover{color:#fff;background:rgba(255,255,255,.08)}
  .ctrl-sm.on{color:var(--accent2);filter:drop-shadow(0 0 6px var(--accent))}
  .ctrl-lg{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(10px);cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;transition:all .2s;
  }
  .ctrl-lg:hover{background:rgba(255,255,255,.22);transform:scale(1.05)}
  .ctrl-lg:active{transform:scale(.95)}
  .play-big{
    width:70px;height:70px;border-radius:50%;
    background:rgba(255,255,255,.96);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
    box-shadow:0 6px 30px rgba(167,139,250,.55),0 2px 10px rgba(0,0,0,.3);
  }
  .play-big:hover{transform:scale(1.07);box-shadow:0 8px 36px rgba(167,139,250,.7)}
  .play-big:active{transform:scale(.93)}
  .play-big svg{color:#1a0a2e}

  /* ── VOLUME ── */
  .volume-row{padding:16px 28px 0;display:flex;align-items:center;gap:10px}
  .vol-icon{color:rgba(255,255,255,.3);flex-shrink:0}
  .vol-slider{
    flex:1;-webkit-appearance:none;appearance:none;
    height:3px;border-radius:3px;outline:none;cursor:pointer;
    background:rgba(255,255,255,.12);
    background-image:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5));
    background-repeat:no-repeat;background-size:70% 100%;
  }
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;
  }

  /* ── QUEUE ── */
  .queue-section{padding:20px 20px 44px}
  .queue-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .queue-header span{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3)}
  .queue-see-all{font-size:12px;color:var(--accent2);background:transparent;border:none;cursor:pointer}
  .queue-list{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
    border-radius:16px;overflow:hidden;backdrop-filter:blur(10px);
  }
  .q-item{
    display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;
    transition:background .15s;border-bottom:1px solid rgba(255,255,255,.04);
  }
  .q-item:last-child{border-bottom:none}
  .q-item:hover{background:rgba(255,255,255,.06)}
  .q-cover{
    width:40px;height:40px;border-radius:9px;flex-shrink:0;
    font-size:18px;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.06);overflow:hidden;
  }
  .q-text{flex:1;min-width:0}
  .q-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-artist{font-size:11px;color:rgba(255,255,255,.4)}
  .q-dur{font-size:11px;color:rgba(255,255,255,.25);flex-shrink:0}

  /* ── MORE MENU ── */
  .more-menu{
    position:fixed;top:110px;right:16px;z-index:200;
    background:rgba(18,12,35,.97);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:6px;min-width:180px;
    backdrop-filter:blur(30px);
    box-shadow:0 8px 40px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transform:scale(.92) translateY(-8px);
    transition:all .2s cubic-bezier(.4,0,.2,1);transform-origin:top right;
  }
  .more-menu.open{opacity:1;pointer-events:all;transform:scale(1) translateY(0)}
  .more-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    cursor:pointer;transition:background .15s;font-size:14px;color:rgba(255,255,255,.85);
  }
  .more-item:hover{background:rgba(255,255,255,.08)}
  .more-item svg{flex-shrink:0;color:var(--accent2)}
  .more-divider{height:1px;background:rgba(255,255,255,.07);margin:4px 0}

  /* ── MODAL ── */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);
    backdrop-filter:blur(10px);display:flex;align-items:flex-end;z-index:300;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{
    width:100%;background:rgba(14,9,28,.98);
    border:1px solid rgba(255,255,255,.1);border-radius:24px 24px 0 0;
    padding:0 22px 36px;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  }
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-handle{width:40px;height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin:16px auto}
  .modal h2{font-size:19px;font-weight:600;margin-bottom:20px}
  .form-row{margin-bottom:14px}
  .form-row label{font-size:12px;color:var(--text2);display:block;margin-bottom:6px}
  .form-row input{
    width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:var(--rsm);padding:11px 14px;color:#fff;font-size:14px;outline:none;transition:border-color .2s;
  }
  .form-row input:focus{border-color:var(--accent)}
  .form-row input::placeholder{color:rgba(255,255,255,.2)}
  .emoji-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .emo-btn{
    width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.06);
    border:2px solid transparent;font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .emo-btn.sel{border-color:var(--accent);background:rgba(167,139,250,.15)}
  .modal-btns{display:flex;gap:10px;margin-top:22px}
  .btn-cancel,.btn-add{
    flex:1;padding:13px;border-radius:var(--rsm);
    font-size:15px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s;
  }
  .btn-cancel{background:rgba(255,255,255,.08);color:var(--text2)}
  .btn-add{background:var(--accent);color:#fff;box-shadow:0 4px 20px rgba(167,139,250,.4)}
  .btn-cancel:active,.btn-add:active{opacity:.75}

  /* ── EMPTY ── */
  .empty{text-align:center;padding:64px 20px}
  .empty .ei{font-size:54px;margin-bottom:14px;opacity:.4}
  .empty p{font-size:15px;color:var(--text2)}
  .empty small{font-size:13px;display:block;margin-top:6px;color:var(--text3)}

  /* ── PARTICLES ── */
  .particle{
    position:fixed;pointer-events:none;border-radius:50%;z-index:9999;
    animation:particleFly .8s forwards;
  }
  @keyframes particleFly{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}
  }

  /* ── ANIMS ── */
  .song-item.in{animation:slideIn .28s cubic-bezier(.4,0,.2,1)}
  @keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
  .song-item.out{animation:slideOut .22s forwards}
  @keyframes slideOut{to{opacity:0;transform:translateX(16px);height:0;padding:0;overflow:hidden}}

  /* screen transition */
  .screen-enter{animation:screenIn .3s cubic-bezier(.4,0,.2,1)}
  @keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<audio id="main-audio"></audio>
<canvas id="bg-canvas"></canvas>

<!-- ══ LIBRARY ══ -->
<div class="screen active" id="screen-library">
  <div class="lib-top">
    <div class="lib-top-left">
      <h1>Music</h1>
      <p id="song-count">0 songs</p>
    </div>
    <div class="lib-top-right">
      
    </div>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search-input" type="text" placeholder="Songs, artists, albums…"/>
    </div>
  </div>
  <div class="tab-row">
    <button class="tab active" data-tab="all">All songs</button>

    </div>
    <div class="mini-cover" id="mini-cover"></div>
    <div class="mini-info">
      <div class="mini-title" id="mini-title">—</div>
      <div class="mini-artist" id="mini-artist">—</div>
    </div>
    <div class="mini-ctrls">
      <button class="mini-btn" id="ml-prev">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button class="mini-play-btn" id="ml-play">
        <svg id="ml-play-icon" width="18" height="18" fill="white" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="mini-btn" id="ml-next">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>
  </div>


</div>

<!-- ══ PLAYER ══ -->
<div class="screen" id="screen-player">
  <div class="player-bg-wrap" id="player-bg-wrap">
    <div class="player-bg-blob b1" id="blob1"></div>
    <div class="player-bg-blob b2" id="blob2"></div>
    <div class="player-bg-blob b3" id="blob3"></div>
    <div class="player-bg-overlay"></div>
    <div class="player-bg-noise"></div>
  </div>
  <div class="player-content">
    <div class="player-header">
      <button class="back-btn" id="back-btn">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="ph-center">
        <span>Now Playing</span>
        <h3 id="p-album">—</h3>
      </div>
      <button class="more-btn" id="more-btn">
        <svg width="18" height="18" fill="white" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>

    <div class="artwork-area">
      <div class="vinyl-wrap">
        <div class="vinyl-disc" id="vinyl-disc"></div>
        <div class="artwork-shadow-ring" id="artwork-ring">
          <div class="artwork" id="p-artwork"></div>
        </div>
      </div>
    </div>

    <canvas id="waveform-canvas"></canvas>

    <div class="track-info">
      <div class="track-text">
        <div class="track-title" id="p-title">—</div>
        <div class="track-artist" id="p-artist">—</div>
      </div>
      <button class="fav-btn" id="fav-btn">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" id="fav-icon">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

    <div class="progress-area">
      <div class="seek-wrap">
        <input type="range" id="seek-bar" class="seek-bar" min="0" max="100" value="0" step="0.1"/>

      <div class="time-row"><span id="t-curr">0:00</span><span id="t-total">0:00</span></div>

    <div class="controls-row">
      <button class="ctrl-sm" id="shuffle-btn">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
      </button>
      <button class="ctrl-lg" id="prev-btn">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button class="play-big" id="play-btn">
        <svg id="play-icon" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>

      <button class="ctrl-lg" id="next-btn">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="ctrl-sm" id="repeat-btn">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>

    <div class="volume-row">
      <svg class="vol-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
      <input type="range" id="vol-slider" class="vol-slider" min="0" max="100" value="70" step="1"/>
      <svg class="vol-icon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </div>

    <div class="queue-section">
      <div class="queue-header">
        <span>Up next</span>
        <button class="queue-see-all">See all</button>
      </div>

    </div>
  </div>
</div>

<!-- ══ MORE MENU ══ -->
<div class="more-menu" id="more-menu">
  <div class="more-item" id="menu-fav">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span>Add to favourites</span>
  </div>
  <div class="more-item" id="menu-copy">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <span>Copy song info</span>
  </div>
  <div class="more-divider"></div>
  <div class="more-item" id="menu-delete" style="color:#f87171">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#f87171" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    <span>Delete song</span>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Add song</h2>
    <div class="form-row"><label>Title</label><input id="in-title" placeholder="e.g. Blinding Lights"/></div>
    <div class="form-row"><label>Artist</label><input id="in-artist" placeholder="e.g. The Weeknd"/></div>
    <div class="form-row"><label>Album</label><input id="in-album" placeholder="e.g. After Hours"/></div>
    <div class="form-row"><label>Duration</label><input id="in-dur" placeholder="3:22"/></div>
    <div class="form-row">
      <label>Cover art</label>
      <div class="emoji-row" id="emo-row"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="m-cancel">Cancel</button>
      <button class="btn-add" id="m-add">Add song</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   CANVAS AURORA BACKGROUND
══════════════════════════════════════════ */
const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
let W,H;
const orbs=[
  {x:.15,y:.2,r:.38,c:'#3b1d7a',vx:.00018,vy:.00013},
  {x:.8,y:.7,r:.32,c:'#1a0f4a',vx:-.00016,vy:.00018},
  {x:.5,y:.5,r:.26,c:'#0d2060',vx:.00020,vy:-.00015},
];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
function drawBg(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#07050f';ctx.fillRect(0,0,W,H);
  for(const o of orbs){
    o.x+=o.vx;o.y+=o.vy;
    if(o.x<-.1||o.x>1.1)o.vx*=-1;
    if(o.y<-.1||o.y>1.1)o.vy*=-1;
    const g=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r*Math.max(W,H));
    g.addColorStop(0,o.c+'bb');g.addColorStop(1,o.c+'00');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
}
resize();window.addEventListener('resize',resize);
(function loop(){drawBg();requestAnimationFrame(loop)})();

/* ══════════════════════════════════════════
   WAVEFORM VISUALIZER
══════════════════════════════════════════ */
const wvCanvas=document.getElementById('waveform-canvas');
const wvCtx=wvCanvas.getContext('2d');
let wvBars=32,wvData=new Array(wvBars).fill(0);
let wvTargets=new Array(wvBars).fill(0);
function resizeWv(){wvCanvas.width=wvCanvas.offsetWidth*devicePixelRatio;wvCanvas.height=wvCanvas.offsetHeight*devicePixelRatio}
function tickWv(){
  if(playing){
    wvTargets=wvTargets.map((_,i)=>Math.random()*(i%3===0?0.9:0.5)+0.1);
  } else {
    wvTargets=wvTargets.map(()=>0.05);
  }
}
function drawWv(){
  resizeWv();
  wvCtx.clearRect(0,0,wvCanvas.width,wvCanvas.height);
  const W2=wvCanvas.width,H2=wvCanvas.height,barW=W2/wvBars,gap=2*devicePixelRatio;
  for(let i=0;i<wvBars;i++){
    wvData[i]+=(wvTargets[i]-wvData[i])*0.15;
    const h=wvData[i]*H2*0.85;
    const x=i*barW+gap/2;
    const y=(H2-h)/2;
    const alpha=0.3+wvData[i]*0.7;
    wvCtx.fillStyle=`rgba(196,181,253,${alpha})`;
    wvCtx.beginPath();
    wvCtx.roundRect(x,y,barW-gap,h,3*devicePixelRatio);
    wvCtx.fill();
  }
}
setInterval(tickWv,120);
(function wvLoop(){drawWv();requestAnimationFrame(wvLoop)})();

/* ══════════════════════════════════════════
   PARTICLES on play
══════════════════════════════════════════ */
function spawnParticles(x,y){
  const colors=['#a78bfa','#c4b5fd','#f472b6','#60a5fa','#fff'];
  for(let i=0;i<14;i++){
    const el=document.createElement('div');
    el.className='particle';
    const size=4+Math.random()*8;
    const angle=Math.random()*Math.PI*2;
    const dist=60+Math.random()*80;
    el.style.cssText=`
      width:${size}px;height:${size}px;
      left:${x-size/2}px;top:${y-size/2}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;
      animation-duration:${0.5+Math.random()*0.5}s;
    `;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1000);
  }
}

/* ══════════════════════════════════════════
   DATA
══════════════════════════════════════════ */
let songs=[],nextId=1;
let curId=null,playing=false,shuffle=false,repeatMode=0;
let progVal=0,progTimer=null,selEmoji='🎵',currentTab='all';

function getSong(id){return songs.find(s=>s.id===id)}
function fmtSec(s){const m=Math.floor(s/60),x=Math.floor(s%60);return`${m}:${x.toString().padStart(2,'0')}`}
function durSec(d){
  if(!d)return 0;
  if(!String(d).includes(':'))return parseInt(d,10)||0;
  const p=String(d).split(':');return(+p[0]||0)*60+(+p[1]||0);
}
function visible(){
  const q=document.getElementById('search-input').value.toLowerCase();
  let list=currentTab==='favorites'?songs.filter(s=>s.fav):
           currentTab==='recent'?[...songs].slice(0,6):[...songs];
  if(q)list=list.filter(s=>s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q));
  return list;
}

/* ══════════════════════════════════════════
   RENDER LIBRARY
══════════════════════════════════════════ */
const labels={'all':'All songs','favorites':'Favourites','recent':'Recently added'};
function renderList(){
  const list=visible();
  document.getElementById('song-count').textContent=`${songs.length} song${songs.length!==1?'s':''}`;
  document.getElementById('section-label').textContent=labels[currentTab]||'';
  const el=document.getElementById('song-list');
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="ei">🎵</div><p>Nothing here yet.</p><small>Tap + to add your first track</small></div>`;
    return;
  }
  el.innerHTML=list.map(s=>`
    <div class="song-item ${s.id===curId?'playing':''}" data-id="${s.id}">
      <div class="cover-thumb" style="background:${s.c1}44" onclick="openPlayer(${s.id})">
        ${s.cover_image
          ?`<img src="/covers/${s.cover_image}" style="width:100%;height:100%;object-fit:cover;border-radius:12px"/>`
          :`<span>${s.cover}</span>`}
        <div class="eq-anim">
          <div class="eq-bar"></div><div class="eq-bar"></div>
          <div class="eq-bar"></div><div class="eq-bar"></div>
        </div>
      </div>
      <div class="song-info" onclick="openPlayer(${s.id})">
        <div class="song-title">${s.title}</div>
        <div class="song-meta">${s.artist} · ${s.album}</div>
      </div>
      <div class="song-right">
        <span class="song-dur">${s.duration}</span>
        <button class="icon-btn ${s.fav?'fav-active':''}" onclick="toggleFav(event,${s.id})">
          <svg width="15" height="15" fill="${s.fav?'#f472b6':'none'}" viewBox="0 0 24 24" stroke="${s.fav?'#f472b6':'currentColor'}" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
        <button class="icon-btn del" onclick="deleteSong(event,${s.id})">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
    </div>`).join('');
}

/* ══════════════════════════════════════════
   PLAYER BG
══════════════════════════════════════════ */
function setPlayerBg(s){
  if(!s)return;
  [['blob1',s.c1,'.58'],['blob2',s.c2,'.46'],['blob3',s.c3,'.36']].forEach(([id,col,op])=>{
    const el=document.getElementById(id);
    el.style.background=col;el.style.opacity=op;
  });
  // update canvas orbs too
  orbs[0].c=s.c1||'#3b1d7a';
  orbs[1].c=s.c2||'#1a0f4a';
}

/* ══════════════════════════════════════════
   RENDER PLAYER
══════════════════════════════════════════ */
function renderPlayer(){
  const s=getSong(curId);if(!s)return;
  setPlayerBg(s);
  const aw=document.getElementById('p-artwork');
  if(s.cover_image){
    aw.innerHTML=`<img src="/covers/${s.cover_image}" style="width:100%;height:100%;object-fit:cover;border-radius:26px"/>`;
  } else {
    aw.textContent=s.cover;
  }
  aw.style.background=`linear-gradient(135deg,${s.c1}99,${s.c3}dd)`;
  document.getElementById('p-title').textContent=s.title;
  document.getElementById('p-artist').textContent=s.artist;
  document.getElementById('p-album').textContent=s.album;
  document.getElementById('t-total').textContent=s.duration;
  const fb=document.getElementById('fav-btn'),fi=document.getElementById('fav-icon');
  fb.classList.toggle('active',s.fav);
  fi.setAttribute('fill',s.fav?'#f472b6':'none');
  fi.setAttribute('stroke',s.fav?'#f472b6':'currentColor');
  renderQueue();updateMini();
}

function renderQueue(){
  const list=visible().length?visible():songs;
  const idx=list.findIndex(s=>s.id===curId);
  const next=[];
  for(let i=1;i<=3;i++)next.push(list[(idx+i)%list.length]);
  document.getElementById('queue-list').innerHTML=next.map(s=>`
    <div class="q-item" onclick="openPlayer(${s.id})">
      <div class="q-cover" style="background:${s.c1}55">
        ${s.cover_image
          ?`<img src="/covers/${s.cover_image}" style="width:100%;height:100%;object-fit:cover;border-radius:9px"/>`
          :s.cover}
      </div>
      <div class="q-text">
        <div class="q-title">${s.title}</div>
        <div class="q-artist">${s.artist}</div>
      </div>
      <span class="q-dur">${s.duration}</span>
    </div>`).join('');
}

function updateMini(){
  const s=getSong(curId);
  const mp=document.getElementById('mini-player');
  if(!s){mp.classList.add('hidden');return}
  mp.classList.remove('hidden');
  const mc=document.getElementById('mini-cover');
  if(s.cover_image){
    mc.innerHTML=`<img src="/covers/${s.cover_image}" style="width:100%;height:100%;object-fit:cover;border-radius:10px"/>`;
  } else {
    mc.textContent=s.cover;
  }
  mc.style.background=s.c1+'66';
  document.getElementById('mini-title').textContent=s.title;
  document.getElementById('mini-artist').textContent=s.artist;
  document.getElementById('mini-prog').style.width=progVal+'%';
  syncPlayIcons();
}

function syncPlayIcons(){
  const play=`<polygon points="5 3 19 12 5 21 5 3"/>`;
  const pause=`<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
  document.getElementById('play-icon').innerHTML=playing?pause:play;
  document.getElementById('ml-play-icon').innerHTML=playing?pause:play;
  const aw=document.getElementById('p-artwork');
  aw.classList.toggle('big',playing);
  // vinyl
  const vd=document.getElementById('vinyl-disc');
  vd.classList.toggle('spinning',playing);
  // artwork ring glow
  document.getElementById('artwork-ring').classList.toggle('glow',playing);
}

/* ══════════════════════════════════════════
   PLAYBACK
══════════════════════════════════════════ */
const audioPlayer=document.getElementById('main-audio');

function openPlayer(id){
  curId=id;progVal=0;
  document.getElementById('seek-bar').value=0;setSeek(0);
  playing=true;startTimer();
  renderPlayer();renderList();syncPlayIcons();
  showScreen('screen-player');
  playSong(getSong(id));
  // show vinyl
  document.getElementById('vinyl-disc').classList.add('visible');
}

function startTimer(){
  clearInterval(progTimer);
  progTimer=setInterval(()=>{
    if(!playing)return;
    const s=getSong(curId);if(!s)return;
    const tot=durSec(s.duration);
    progVal=Math.min(progVal+100/tot,100);
    document.getElementById('seek-bar').value=progVal;
    setSeek(progVal);
    const curr=Math.floor(progVal/100*tot);
    document.getElementById('t-curr').textContent=fmtSec(curr);
    document.getElementById('mini-prog').style.width=progVal+'%';
    if(progVal>=100){repeatMode===2?progVal=0:nextSong()}
  },1000);
}

function setSeek(p){document.getElementById('seek-bar').style.backgroundSize=`${p}% 100%`}

function togglePlay(e){
  if(!curId){if(songs.length)openPlayer(songs[0].id);return}
  playing=!playing;
  if(playing){
    startTimer();audioPlayer.play();
    if(e){const r=document.getElementById('play-btn').getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2)}
  } else {
    clearInterval(progTimer);audioPlayer.pause();
  }
  syncPlayIcons();
}

function playSong(song){
  if(!song||!song.file_path){console.error('No file_path:',song);return}
  const filename=song.file_path.replace(/^\/?(songs\/)?/,'');
  audioPlayer.src=`http://localhost:3000/songs/${filename}`;
  audioPlayer.play().catch(err=>console.error('Playback failed:',err));
}

function nextSong(){
  const list=visible().length?visible():songs;if(!list.length)return;
  let idx=list.findIndex(s=>s.id===curId);
  if(shuffle)idx=Math.floor(Math.random()*list.length)-1;
  audioPlayer.pause();audioPlayer.src='';
  curId=list[(idx+1)%list.length].id;
  progVal=0;renderPlayer();renderList();syncPlayIcons();
  if(playing){startTimer();playSong(getSong(curId))}
}

function prevSong(){
  if(progVal>8){progVal=0;document.getElementById('seek-bar').value=0;setSeek(0);audioPlayer.currentTime=0;return}
  const list=visible().length?visible():songs;if(!list.length)return;
  const idx=list.findIndex(s=>s.id===curId);
  audioPlayer.pause();audioPlayer.src='';
  curId=list[(idx-1+list.length)%list.length].id;
  progVal=0;renderPlayer();renderList();syncPlayIcons();
  if(playing){startTimer();playSong(getSong(curId))}
}

/* ══════════════════════════════════════════
   FAV / DELETE
══════════════════════════════════════════ */
function toggleFav(e,id){
  e.stopPropagation();
  const s=getSong(id);if(!s)return;
  s.fav=!s.fav;saveFav(id,s.fav);
  renderList();if(id===curId)renderPlayer();
}
function deleteSong(e,id){
  e.stopPropagation();
  deleteFromDB(id);
  const el=document.querySelector(`.song-item[data-id="${id}"]`);
  if(el){
    el.classList.add('out');
    setTimeout(()=>{
      songs=songs.filter(s=>s.id!==id);
      if(curId===id){playing=false;clearInterval(progTimer);audioPlayer.pause();curId=null;document.getElementById('mini-player').classList.add('hidden')}
      renderList();
    },220);
  }
}

/* ══════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const scr=document.getElementById(id);
  scr.classList.add('active','screen-enter');
  setTimeout(()=>scr.classList.remove('screen-enter'),300);
  window.scrollTo(0,0);
}

/* ══════════════════════════════════════════
   MORE MENU
══════════════════════════════════════════ */
document.getElementById('more-btn').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('more-menu').classList.toggle('open');
});
document.addEventListener('click',()=>document.getElementById('more-menu').classList.remove('open'));
document.getElementById('menu-fav').addEventListener('click',()=>{
  const s=getSong(curId);if(!s)return;
  s.fav=!s.fav;saveFav(curId,s.fav);renderPlayer();renderList();
  document.getElementById('menu-fav').querySelector('span').textContent=s.fav?'Remove from favourites':'Add to favourites';
});
document.getElementById('menu-copy').addEventListener('click',()=>{
  const s=getSong(curId);if(!s)return;
  navigator.clipboard.writeText(`${s.title} - ${s.artist} (${s.album})`);
});
document.getElementById('menu-delete').addEventListener('click',()=>{
  if(!curId)return;
  deleteSong({stopPropagation:()=>{}},curId);
  showScreen('screen-library');
});

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
const emojis=['🎸','🎹','🥁','🎷','🎺','🎻','🎵','🎶','🔥','💜','🌙','⭐','🌊','🌈','🍂','🏔️','🎤','🎧','🎼','🎙️','🍑','🌸'];
const colorPairs=[
  {c1:'#7b2d8b',c2:'#1a0630',c3:'#3d1460'},{c1:'#0e4d92',c2:'#051a40',c3:'#0a3060'},
  {c1:'#a03000',c2:'#250a00',c3:'#601800'},{c1:'#0f6e3a',c2:'#041a0e',c3:'#0a3d22'},
  {c1:'#6a1da0',c2:'#18042a',c3:'#3d0e60'},{c1:'#b45309',c2:'#271000',c3:'#7c2d12'},
  {c1:'#1d4ed8',c2:'#030e30',c3:'#1e3a8a'},{c1:'#374151',c2:'#060810',c3:'#1f2937'},
];
const emoRow=document.getElementById('emo-row');
emoRow.innerHTML=emojis.map((e,i)=>`<button class="emo-btn${i===6?' sel':''}" data-e="${e}">${e}</button>`).join('');
emoRow.querySelectorAll('.emo-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    selEmoji=b.dataset.e;
    emoRow.querySelectorAll('.emo-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
});

document.getElementById('m-cancel').addEventListener('click',closeModal);
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  ['in-title','in-artist','in-album','in-dur'].forEach(id=>document.getElementById(id).value='');
  selEmoji='🎵';emoRow.querySelectorAll('.emo-btn').forEach((b,i)=>b.classList.toggle('sel',i===6));
}
document.getElementById('m-add').addEventListener('click',()=>{
  const t=document.getElementById('in-title').value.trim();
  const a=document.getElementById('in-artist').value.trim();
  if(!t||!a){
    document.getElementById('in-title').style.borderColor=t?'':'var(--danger)';
    document.getElementById('in-artist').style.borderColor=a?'':'var(--danger)';
    return;
  }
  const album=document.getElementById('in-album').value.trim()||'Unknown Album';
  const dur=document.getElementById('in-dur').value.trim()||'3:00';
  const cols=colorPairs[Math.floor(Math.random()*colorPairs.length)];
  saveNewSong({title:t,artist:a,album,duration:dur,cover_emoji:selEmoji,color1:cols.c1,color2:cols.c2,color3:cols.c3});
  closeModal();
});

/* ══════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════ */
document.getElementById('back-btn').addEventListener('click',()=>{showScreen('screen-library');renderList()});
document.getElementById('play-btn').addEventListener('click',e=>togglePlay(e));
document.getElementById('next-btn').addEventListener('click',nextSong);
document.getElementById('prev-btn').addEventListener('click',prevSong);
document.getElementById('ml-play').addEventListener('click',e=>{e.stopPropagation();togglePlay(null)});
document.getElementById('ml-next').addEventListener('click',e=>{e.stopPropagation();nextSong()});
document.getElementById('ml-prev').addEventListener('click',e=>{e.stopPropagation();prevSong()});
document.getElementById('mini-player').addEventListener('click',()=>{if(curId){renderPlayer();showScreen('screen-player')}});
document.getElementById('fav-btn').addEventListener('click',()=>{
  const s=getSong(curId);if(!s)return;s.fav=!s.fav;saveFav(curId,s.fav);renderPlayer();renderList();
});
document.getElementById('shuffle-btn').addEventListener('click',()=>{
  shuffle=!shuffle;document.getElementById('shuffle-btn').classList.toggle('on',shuffle);
});
document.getElementById('repeat-btn').addEventListener('click',()=>{
  repeatMode=(repeatMode+1)%3;document.getElementById('repeat-btn').classList.toggle('on',repeatMode>0);
});
document.getElementById('seek-bar').addEventListener('input',e=>{
  progVal=parseFloat(e.target.value);setSeek(progVal);
  const s=getSong(curId);if(!s)return;
  const secs=progVal/100*durSec(s.duration);
  document.getElementById('t-curr').textContent=fmtSec(Math.floor(secs));
  if(audioPlayer)audioPlayer.currentTime=secs;
});
document.getElementById('vol-slider').addEventListener('input',e=>{
  document.getElementById('vol-slider').style.backgroundSize=`${e.target.value}% 100%`;
  if(audioPlayer)audioPlayer.volume=e.target.value/100;
});
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    currentTab=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');renderList();
  });
});
document.getElementById('search-input').addEventListener('input',renderList);

/* ══════════════════════════════════════════
   API
══════════════════════════════════════════ */
const API='http://localhost:3000/api';

async function loadSongs(){
  try{
    const res=await fetch(`${API}/songs`);
    const dbSongs=await res.json();
    songs=dbSongs.map(s=>({
      id:s.id,title:s.title||'Unknown Title',artist:s.artist||'Unknown Artist',
      album:s.album||'Single',duration:s.duration||'0:00',
      file_path:s.file_path,
      cover_image:s.cover_image||null,
      cover:s.cover_emoji||'🎵',
      c1:s.color1||'#7b2d8b',c2:s.color2||'#1a0630',c3:s.color3||'#3d1460',
      fav:!!s.is_favorite
    }));
    renderList();
  }catch(err){console.error('Could not load songs:',err)}
}

async function saveNewSong(data){
  try{
    const res=await fetch(`${API}/songs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const song=await res.json();
    songs.unshift({
      id:song.id,title:song.title,artist:song.artist,album:song.album,
      duration:song.duration,file_path:song.file_path,
      cover_image:song.cover_image||null,cover:song.cover_emoji||'🎵',
      c1:song.color1||'#7b2d8b',c2:song.color2||'#1a0630',c3:song.color3||'#3d1460',fav:false
    });
    renderList();
  }catch(err){console.error('Error adding song:',err)}
}

async function deleteFromDB(id){
  try{await fetch(`${API}/songs/${id}`,{method:'DELETE'})}
  catch(err){console.error('Error deleting:',err)}
}

async function saveFav(id,fav){
  try{
    await fetch(`${API}/songs/${id}/favorite`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fav})});
  }catch(err){console.error('Error saving fav:',err)}
}

/* ══ INIT ══ */
loadSongs();
document.getElementById('vol-slider').style.backgroundSize='70% 100%';
</script>
